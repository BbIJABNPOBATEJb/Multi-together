name: ${name}
version: ${version}
main: ${main}
api-version: '1.20'
authors: [ BbIJABNPOBATEJb ]
description: Links players with a chain, shared health, hunger and inventory - for videos and challenges.
website: https://github.com/BbIJABNPOBATEJb/Multi-together

# Commands are registered by LiteCommands on enable: /multitogether (/together, /link, /дштл...)
# and /unlink (/гтдштл...), so they are not listed here.

permissions:
  multitogether.admin:
    description: Link and unlink players, open the menu and settings, change the language
    default: op
