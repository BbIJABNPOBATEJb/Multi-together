# MultiTogether — 日本語
#
# {placeholders} in braces are filled in by the plugin: keep them as they are, do not translate them.
# Colors are added by the plugin. Do not use < and > in texts.
# Long descriptions are wrapped automatically in menus, write them as one line.
# A missing key falls back to English.

language:
  name: "日本語"
  changed: "言語：{language}"
  current: "現在の言語：{language}"
  available: "利用可能：{languages}"
  unknown: "不明な言語です：{input}。利用可能：{languages}"

types:
  all: "すべて"
  chain:
    name: "鎖"
    title: "鎖"
    description: "プレイヤー同士が鎖でつながれます。鎖の長さ以上には離れられず、誰か一人がテレポートすると全員が一緒に移動します。"
  health:
    name: "体力"
    title: "体力"
    description: "全員で一つの体力を共有します。一人が死ねば全員が死にます。"
  food:
    name: "満腹度"
    title: "満腹度"
    description: "満腹度と隠し満腹度を共有します。一人が食べれば全員が満たされます。"
  inventory:
    name: "インベントリ"
    title: "インベントリ"
    description: "防具を含むインベントリを全員で共有します。一人が手に持っているアイテムは、全員の手にあります。"

styles:
  iron: "鉄"
  copper: "銅"
  exposed: "少し錆びた銅"
  weathered: "錆びた銅"
  oxidized: "酸化した銅"

