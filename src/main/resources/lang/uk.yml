# MultiTogether — Українська
#
# {placeholders} in braces are filled in by the plugin: keep them as they are, do not translate them.
# Colors are added by the plugin. Do not use < and > in texts.
# Long descriptions are wrapped automatically in menus, write them as one line.
# A missing key falls back to English.

language:
  name: "Українська"
  changed: "Мова: {language}"
  current: "Поточна мова: {language}"
  available: "Доступні: {languages}"
  unknown: "Невідома мова {input}. Доступні: {languages}"

types:
  all: "усе"
  chain:
    name: "ланцюг"
    title: "Ланцюг"
    description: "Гравці скуті ланцюгом: вони не можуть розійтися далі, ніж дозволяє довжина ланцюга, а телепорт одного переносить усіх."
  health:
    name: "здоров'я"
    title: "Здоров'я"
    description: "Одна смужка здоров'я на всіх. Помирає один — помирають усі."
  food:
    name: "голод"
    title: "Голод"
    description: "Спільні голод і насичення: їсть один — ситі всі."
  inventory:
    name: "інвентар"
    title: "Інвентар"
    description: "Один інвентар із бронею на всіх: предмет у руці одного гравця — у руці в усіх."

