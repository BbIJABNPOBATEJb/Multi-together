# MultiTogether — Français
#
# {placeholders} in braces are filled in by the plugin: keep them as they are, do not translate them.
# Colors are added by the plugin. Do not use < and > in texts.
# Long descriptions are wrapped automatically in menus, write them as one line.
# A missing key falls back to English.

language:
  name: "Français"
  changed: "Langue : {language}"
  current: "Langue actuelle : {language}"
  available: "Disponibles : {languages}"
  unknown: "Langue inconnue {input}. Disponibles : {languages}"

types:
  all: "tout"
  chain:
    name: "chaîne"
    title: "Chaîne"
    description: "Les joueurs sont enchaînés : ils ne peuvent pas s'éloigner au-delà de la longueur de la chaîne, et si l'un est téléporté, tous le suivent."
  health:
    name: "vie"
    title: "Vie"
    description: "Une seule barre de vie pour tous. Si l'un meurt, tout le monde meurt."
  food:
    name: "faim"
    title: "Faim"
    description: "Faim et saturation partagées : si l'un mange, tout le monde est rassasié."
  inventory:
    name: "inventaire"
    title: "Inventaire"
    description: "Un seul inventaire, armure comprise, pour tous : un objet dans la main d'un joueur est dans la main de tous."

styles:
  iron: "Fer"
  copper: "Cuivre"
  exposed: "Cuivre exposé"
  weathered: "Cuivre érodé"
  oxidized: "Cuivre oxydé"

