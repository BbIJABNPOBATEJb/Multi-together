  available: "Có sẵn: {languages}"
  unknown: "Không rõ ngôn ngữ {input}. Có sẵn: {languages}"

types:
  all: "tất cả"
  chain:
    name: "xích"
    title: "Xích"
    description: "Người chơi bị xích vào nhau: không thể cách xa nhau hơn chiều dài xích, và khi một người dịch chuyển thì tất cả đi theo."
  health:
    name: "máu"
    title: "Máu"
    description: "Một thanh máu chung cho tất cả. Một người chết, tất cả cùng chết."
  food:
    name: "độ đói"
    title: "Độ đói"
    description: "Chung độ đói và độ bão hòa: một người ăn, tất cả cùng no."
  inventory:
    name: "túi đồ"
    title: "Túi đồ"
    description: "Một túi đồ chung cho tất cả, kể cả giáp: vật phẩm trên tay một người cũng có trên tay mọi người."

