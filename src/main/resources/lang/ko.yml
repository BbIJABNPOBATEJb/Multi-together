# MultiTogether — 한국어
#
# {placeholders} in braces are filled in by the plugin: keep them as they are, do not translate them.
# Colors are added by the plugin. Do not use < and > in texts.
# Long descriptions are wrapped automatically in menus, write them as one line.
# A missing key falls back to English.

language:
  name: "한국어"
  changed: "언어: {language}"
  current: "현재 언어: {language}"
  available: "사용 가능: {languages}"
  unknown: "알 수 없는 언어: {input}. 사용 가능: {languages}"

types:
  all: "전체"
  chain:
    name: "사슬"
    title: "사슬"
    description: "플레이어들이 사슬로 묶입니다. 사슬 길이보다 멀리 떨어질 수 없으며, 한 명이 순간이동하면 모두가 함께 이동합니다."
  health:
    name: "체력"
    title: "체력"
    description: "모두가 하나의 체력을 공유합니다. 한 명이 죽으면 모두가 죽습니다."
  food:
    name: "허기"
    title: "허기"
    description: "허기와 포화도를 공유합니다. 한 명이 먹으면 모두가 배부릅니다."
  inventory:
    name: "인벤토리"
    title: "인벤토리"
    description: "갑옷을 포함한 인벤토리 하나를 모두가 공유합니다. 한 플레이어의 손에 든 아이템은 모두의 손에 들려 있습니다."

styles:
  iron: "철"
  copper: "구리"
  exposed: "약간 녹슨 구리"
  weathered: "녹슨 구리"
  oxidized: "산화된 구리"

