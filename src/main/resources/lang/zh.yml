# MultiTogether — 简体中文
#
# {placeholders} in braces are filled in by the plugin: keep them as they are, do not translate them.
# Colors are added by the plugin. Do not use < and > in texts.
# Long descriptions are wrapped automatically in menus, write them as one line.
# A missing key falls back to English.

language:
  name: "简体中文"
  changed: "语言：{language}"
  current: "当前语言：{language}"
  available: "可用语言：{languages}"
  unknown: "未知语言 {input}。可用语言：{languages}"

types:
  all: "全部"
  chain:
    name: "锁链"
    title: "锁链"
    description: "玩家被锁链连在一起：彼此之间的距离不能超过锁链长度，其中一人被传送时会把所有人一起带走。"
  health:
    name: "生命值"
    title: "生命值"
    description: "所有人共用一条生命值。一人死亡，全员死亡。"
  food:
    name: "饥饿值"
    title: "饥饿值"
    description: "共享饥饿值和饱和度：一人进食，全员吃饱。"
  inventory:
    name: "物品栏"
    title: "物品栏"
    description: "所有人共用一个物品栏（含盔甲）：一名玩家手中的物品，也在所有人手中。"

styles:
  iron: "铁"
  copper: "铜"
  exposed: "斑驳的铜"
  weathered: "锈蚀的铜"
  oxidized: "氧化的铜"

