types:
  all: "tutto"
  chain:
    name: "catena"
    title: "Catena"
    description: "I giocatori sono incatenati tra loro: non possono allontanarsi oltre la lunghezza della catena, e il teletrasporto di uno porta con sé tutti gli altri."
  health:
    name: "salute"
    title: "Salute"
    description: "Una sola barra della salute per tutti. Muore uno, muoiono tutti."
  food:
    name: "fame"
    title: "Fame"
    description: "Fame e sazietà condivise: uno mangia, tutti sono sazi."
  inventory:
    name: "inventario"
    title: "Inventario"
    description: "Un solo inventario con armatura per tutti: un oggetto in mano a un giocatore è in mano a tutti."

