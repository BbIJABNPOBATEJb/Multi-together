# MultiTogether — Português
#
# {placeholders} in braces are filled in by the plugin: keep them as they are, do not translate them.
# Colors are added by the plugin. Do not use < and > in texts.
# Long descriptions are wrapped automatically in menus, write them as one line.
# A missing key falls back to English.

language:
  name: "Português"
  changed: "Idioma: {language}"
  current: "Idioma atual: {language}"
  available: "Disponíveis: {languages}"
  unknown: "Idioma desconhecido {input}. Disponíveis: {languages}"

types:
  all: "tudo"
  chain:
    name: "corrente"
    title: "Corrente"
    description: "Os jogadores ficam acorrentados: não podem se afastar mais do que o comprimento da corrente, e se um for teletransportado, todos vão junto."
  health:
    name: "vida"
    title: "Vida"
    description: "Uma só barra de vida para todos. Um morre, todos morrem."
  food:
    name: "fome"
    title: "Fome"
    description: "Fome e saturação compartilhadas: um come, todos ficam saciados."
  inventory:
    name: "inventário"
    title: "Inventário"
    description: "Um só inventário com armadura para todos: um item na mão de um jogador está na mão de todos."

styles:
  iron: "Ferro"
  copper: "Cobre"
  exposed: "Cobre exposto"
  weathered: "Cobre desgastado"
  oxidized: "Cobre oxidado"

