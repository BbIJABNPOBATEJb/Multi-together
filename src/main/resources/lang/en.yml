# MultiTogether — English
#
# {placeholders} in braces are filled in by the plugin: keep them as they are, do not translate them.
# Colors are added by the plugin. Do not use < and > in texts.
# Long descriptions are wrapped automatically in menus, write them as one line.
# A missing key falls back to English.

language:
  name: "English"
  changed: "Language: {language}"
  current: "Current language: {language}"
  available: "Available: {languages}"
  unknown: "Unknown language {input}. Available: {languages}"

types:
  all: "everything"
  chain:
    name: "chain"
    title: "Chain"
    description: "Players are chained together: they can't get farther apart than the chain length, and a teleport of one brings everyone along."
  health:
    name: "health"
    title: "Health"
    description: "One health bar for everyone. One dies, everyone dies."
  food:
    name: "hunger"
    title: "Hunger"
    description: "Shared hunger and saturation: one eats, everyone is fed."
  inventory:
    name: "inventory"
    title: "Inventory"
    description: "One inventory with armor for everyone: an item in one player's hand is in everyone's hand."

styles:
  iron: "Iron"
  copper: "Copper"
  exposed: "Exposed copper"
  weathered: "Weathered copper"
  oxidized: "Oxidized copper"

# Argument names in command usage lines
args:
  player1: "player1"
  player2: "player2"
  player: "player"
  type: "type"
  blocks: "blocks"
  language: "language"

command:
  player-not-found: "Player {player} is not found or offline"
