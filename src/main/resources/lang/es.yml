# MultiTogether — Español
#
# {placeholders} in braces are filled in by the plugin: keep them as they are, do not translate them.
# Colors are added by the plugin. Do not use < and > in texts.
# Long descriptions are wrapped automatically in menus, write them as one line.
# A missing key falls back to English.

language:
  name: "Español"
  changed: "Idioma: {language}"
  current: "Idioma actual: {language}"
  available: "Disponibles: {languages}"
  unknown: "Idioma desconocido {input}. Disponibles: {languages}"

types:
  all: "todo"
  chain:
    name: "cadena"
    title: "Cadena"
    description: "Los jugadores están encadenados: no pueden alejarse más que la longitud de la cadena, y si uno se teletransporta, se lleva a todos consigo."
  health:
    name: "salud"
    title: "Salud"
    description: "Una sola barra de salud para todos. Si uno muere, mueren todos."
  food:
    name: "hambre"
    title: "Hambre"
    description: "Hambre y saturación compartidas: si uno come, todos quedan saciados."
  inventory:
    name: "inventario"
    title: "Inventario"
    description: "Un solo inventario con armadura para todos: un objeto en la mano de un jugador está en la mano de todos."

styles:
  iron: "Hierro"
  copper: "Cobre"
  exposed: "Cobre expuesto"
  weathered: "Cobre erosionado"
  oxidized: "Cobre oxidado"

