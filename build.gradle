plugins {
    id 'java'
    id 'com.gradleup.shadow' version '8.3.8'
}

group = pluginGroup
version = pluginVersion

// Один jar на Paper 1.20–26.3. Компиляция против самого старого API (1.20.1) и под Java 17:
// 1.20.1–1.20.4 работают на Java 17. Всё, чего в 1.20.1 нет, вызывается через Compat,
// а внутренности сервера — рефлексией по типам полей, без имён: у 1.20.1–1.20.4
// в рантайме мэппинги Spigot, у 1.20.5+ — Mojang.
java {
    toolchain.languageVersion = JavaLanguageVersion.of(21)
}

repositories {
    mavenCentral()
    maven { url = 'https://repo.papermc.io/repository/maven-public/' }
    maven { url = 'https://repo.panda-lang.org/releases' }
}

dependencies {
    compileOnly libs.paper.api

    implementation libs.litecommands.bukkit

    compileOnly libs.lombok
    annotationProcessor libs.lombok
}

// Аннотации JetBrains нужны только компилятору: в рантайме их никто не читает
configurations.runtimeClasspath {
    exclude group: 'org.jetbrains', module: 'annotations'
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.release.set(javaVer.toInteger())
    options.compilerArgs.add('-Xlint:deprecation')
    // LiteCommands берёт имена аргументов из байткода
    options.compilerArgs.add('-parameters')
}

processResources {
    filteringCharset = 'UTF-8'

    def props = [
            version: project.version,
            name   : pluginName,
            main   : pluginMainClass,
    ]
    inputs.properties props

    filesMatching('plugin.yml') {
        expand props
    }
}

tasks.jar {
    archiveClassifier = 'dev'
}

// Всё чужое уезжает в свой пакет: на сервере рядом может стоять другой плагин
// с LiteCommands другой версии, и без релокации выиграл бы тот, что загрузился первым.
def libsPackage = 'me.bbijabnpobatejb.multitogether.libs'

tasks.shadowJar {
    archiveClassifier = ''
    // Классов сервера плагин напрямую не трогает: Paper 1.20.5+ не нужно его перемаппливать
    manifest {
        attributes('paperweight-mappings-namespace': 'mojang')
    }
    archiveFileName = "${pluginName}-${project.version}.jar"

    relocate 'dev.rollczi.litecommands', "${libsPackage}.litecommands"
    relocate 'panda.std', "${libsPackage}.panda.std"
    relocate 'panda.utilities', "${libsPackage}.panda.utilities"

    exclude 'META-INF/maven/**'
    exclude 'META-INF/*.kotlin_module'
    exclude 'META-INF/versions/**'
    exclude 'META-INF/LICENSE*'
    exclude 'META-INF/NOTICE*'
    exclude 'META-INF/*.SF'
    exclude 'META-INF/*.DSA'
    exclude 'META-INF/*.RSA'

    mergeServiceFiles()
}

tasks.assemble {
    dependsOn tasks.shadowJar
}
